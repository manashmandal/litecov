name: 'LiteCov'
description: 'Lightweight code coverage reporter - posts PR comments with coverage stats'
author: 'Manash Kumar Mandal'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  coverage-file:
    description: 'Path to coverage report file (auto-detected if not specified)'
    required: false
  format:
    description: 'Coverage format: auto, lcov, cobertura, go'
    required: false
    default: 'auto'
  show-files:
    description: 'Files to show: all, changed, threshold:N, worst:N'
    required: false
    default: 'changed'
  threshold:
    description: 'Minimum coverage threshold for passing status (0-100)'
    required: false
    default: '0'
  patch-threshold:
    description: 'Minimum patch coverage threshold for passing status (0-100), independent of threshold'
    required: false
    default: '0'
  good-threshold:
    description: 'Coverage percentage at/above which a file or the project gets a passing status in the report (0 = default of 80). Independent of threshold, which only gates the commit status.'
    required: false
    default: '0'
  warn-threshold:
    description: 'Coverage percentage at/above which a file or the project gets a warning instead of a failing status in the report (0 = default of 50)'
    required: false
    default: '0'
  title:
    description: 'Comment title'
    required: false
    default: 'Coverage Report'
  flag:
    description: 'Identifies this invocation when litecov runs more than once on one PR (e.g. backend, frontend); scopes the comment marker and commit status context so parallel runs coexist instead of overwriting each other'
    required: false
  annotations:
    description: 'Output GitHub annotations for uncovered lines'
    required: false
    default: 'false'
  base-coverage-file:
    description: 'Path to base branch coverage file for comparison'
    required: false
  base-branch:
    description: 'Base branch name for display in diff header'
    required: false
    default: ${{ github.event.pull_request.base.ref }}
  path-prefix:
    description: 'Prefix to strip from every coverage report path, e.g. "backend/"'
    required: false
  path-fixes:
    description: 'Newline separated "before::after" path rewrite rules, same shorthand as Codecov''s fixes:'
    required: false
  token:
    description: 'GitHub token'
    required: false
    default: ${{ github.token }}

outputs:
  coverage:
    description: 'Total coverage percentage'
  lines-covered:
    description: 'Number of covered lines'
  lines-total:
    description: 'Total number of lines'
  files-count:
    description: 'Number of files with coverage data'

runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    GITHUB_TOKEN: ${{ inputs.token }}
    INPUT_COVERAGE_FILE: ${{ inputs.coverage-file }}
    INPUT_FORMAT: ${{ inputs.format }}
    INPUT_SHOW_FILES: ${{ inputs.show-files }}
    INPUT_THRESHOLD: ${{ inputs.threshold }}
    INPUT_PATCH_THRESHOLD: ${{ inputs.patch-threshold }}
    INPUT_GOOD_THRESHOLD: ${{ inputs.good-threshold }}
    INPUT_WARN_THRESHOLD: ${{ inputs.warn-threshold }}
    INPUT_TITLE: ${{ inputs.title }}
    INPUT_FLAG: ${{ inputs.flag }}
    INPUT_ANNOTATIONS: ${{ inputs.annotations }}
    INPUT_BASE_COVERAGE_FILE: ${{ inputs.base-coverage-file }}
    INPUT_BASE_BRANCH: ${{ inputs.base-branch }}
    INPUT_PATH_PREFIX: ${{ inputs.path-prefix }}
    INPUT_PATH_FIXES: ${{ inputs.path-fixes }}
